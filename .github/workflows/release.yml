name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave blank to verify builds without publishing)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: windows-arm64
            os: windows-11-arm
            rust-targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - name: macos-universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - name: linux-x64
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage
          - name: linux-arm64
            os: ubuntu-24.04-arm
            rust-targets: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --bundles appimage

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-install-suggests \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Run self-checks
        run: npm run selfcheck

      - name: Run TypeScript type checks
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Test Studio in Chromium
        if: matrix.name == 'linux-x64'
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:studio

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Package application
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.name }}

      - name: Build Windows portable executable
        if: runner.os == 'Windows'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run package:win:portable -- --target ${{ matrix.rust-targets }}

      - name: Verify portable startup and settings location
        if: runner.os == 'Windows'
        id: portable
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "Knead Portable ${{ github.run_attempt }}")
          $binary = Join-Path $stage.FullName "Knead_${version}_${{ matrix.name }}_portable.exe"
          Copy-Item -LiteralPath "src-tauri/target/${{ matrix.rust-targets }}/release/Knead-Portable.exe" -Destination $binary
          $settings = Join-Path $stage.FullName 'KneadData/settings.json'
          $process = Start-Process -FilePath $binary -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            while (!(Test-Path -LiteralPath $settings -PathType Leaf) -or (Get-Item -LiteralPath $settings).Length -eq 0) {
              if ($process.HasExited) { throw "Portable executable exited with code $($process.ExitCode)" }
              if ([DateTime]::UtcNow -ge $deadline) { throw "Portable startup did not create $settings" }
              Start-Sleep -Milliseconds 250
            }
            if (!(Get-Content -Raw -LiteralPath $settings | ConvertFrom-Json).theme) {
              throw "Portable settings are missing a theme"
            }
          } finally {
            if (!$process.HasExited) {
              $null = $process.CloseMainWindow()
              if (!$process.WaitForExit(5000)) { $process.Kill() }
            }
          }
          "path=$binary" >> $env:GITHUB_OUTPUT

      - name: Upload Windows portable executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-portable
          path: ${{ steps.portable.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create or update release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
